# AgentFuse bundled price snapshot.
#
# Schema: [provider."model"]
#           input_usd_per_1k  = X.YZ
#           output_usd_per_1k = X.YZ
#
# Model names are quoted so dotted/dashed names (gemini-1.5-flash, gpt-4.1)
# are treated as a single leaf key, not as a nested TOML table path.
#
# Lookup keys are case-insensitive; the longest prefix match wins.
# Override per-machine by editing ~/.fuse/prices.toml — user keys win.
# Snapshot as of 2026-05.

