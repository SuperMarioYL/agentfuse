<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
     role="img" aria-label="AgentFuse architecture: a coding-agent CLI child is pointed at the local AgentFuse proxy, which runs account guard, pre-flight estimate and ledger-vs-cap check; ALLOW forwards to the configured provider and DENY returns HTTP 402; every reply's usage is written to the local bbolt ledger">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>

  <!-- local-only frame -->
  <rect x="24" y="28" width="600" height="308" rx="18" fill="none" stroke="#D97706" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="50" font-size="13" font-weight="600" fill="#92400E">localhost — no daemon, no telemetry</text>

  <!-- connectors -->
  <g stroke="#C9C9D0" stroke-width="1.6" fill="none">
    <line x1="232" y1="150" x2="300" y2="150" marker-end="url(#ah-l)"/>
    <line x1="624" y1="150" x2="700" y2="150" marker-end="url(#ah-l)"/>
  </g>
  <!-- DENY return path -->
  <g stroke="#DC2626" stroke-width="1.6" fill="none" stroke-dasharray="5 4">
    <path d="M300 256 L266 256 L266 188" marker-end="url(#ah-l)"/>
  </g>
  <!-- ledger write path -->
  <g stroke="#C9C9D0" stroke-width="1.6" fill="none">
    <line x1="462" y1="300" x2="462" y2="332" marker-end="url(#ah-l)"/>
  </g>

  <!-- Agent CLI child -->
  <g>
    <rect x="44" y="92" width="188" height="116" rx="15" fill="#475569" fill-opacity="0.08" stroke="#475569" stroke-width="1.5"/>
    <text x="138" y="120" text-anchor="middle" font-size="15" font-weight="600" fill="#334155">Coding-agent CLI</text>
    <text x="138" y="142" text-anchor="middle" font-size="11.5" fill="#475569">claude · codex · aider</text>
    <rect x="62" y="156" width="152" height="38" rx="9" fill="#475569" fill-opacity="0.10" stroke="#475569" stroke-width="1.1"/>
    <text x="138" y="174" text-anchor="middle" font-size="10.5" fill="#334155">ANTHROPIC_BASE_URL</text>
    <text x="138" y="188" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">→ 127.0.0.1:rand</text>
  </g>

  <!-- AgentFuse proxy -->
  <g>
    <rect x="300" y="92" width="324" height="208" rx="15" fill="#D97706" fill-opacity="0.10" stroke="#D97706" stroke-width="1.6"/>
    <text x="462" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#92400E">AgentFuse proxy — fail-closed</text>
    <g font-size="12.5">
      <rect x="320" y="132" width="284" height="34" rx="9" fill="#FFFFFF" fill-opacity="0.6" stroke="#D97706" stroke-width="1.1"/>
      <text x="334" y="154" fill="#3f3325"><tspan font-weight="700" fill="#B45309">1</tspan>  account guard — fingerprint match</text>
      <rect x="320" y="172" width="284" height="34" rx="9" fill="#FFFFFF" fill-opacity="0.6" stroke="#D97706" stroke-width="1.1"/>
      <text x="334" y="194" fill="#3f3325"><tspan font-weight="700" fill="#B45309">2</tspan>  pre-flight estimate (tiktoken)</text>
      <rect x="320" y="212" width="284" height="34" rx="9" fill="#FFFFFF" fill-opacity="0.6" stroke="#D97706" stroke-width="1.1"/>
      <text x="334" y="234" fill="#3f3325"><tspan font-weight="700" fill="#B45309">3</tspan>  ledger check vs cap_usd</text>
      <rect x="320" y="252" width="284" height="34" rx="9" fill="#DC2626" fill-opacity="0.10" stroke="#DC2626" stroke-width="1.1"/>
      <text x="334" y="274" fill="#7F1D1D"><tspan font-weight="700" fill="#DC2626">4</tspan>  DENY → HTTP 402  ·  ALLOW → forward</text>
    </g>
  </g>

  <!-- Providers -->
  <g>
    <rect x="700" y="92" width="156" height="208" rx="15" fill="#0071E3" fill-opacity="0.08" stroke="#0071E3" stroke-width="1.5"/>
    <text x="778" y="118" text-anchor="middle" font-size="15" font-weight="600" fill="#0A4F9E">Providers</text>
    <g font-size="12" font-weight="600">
      <rect x="716" y="134" width="124" height="30" rx="8" fill="#0071E3" fill-opacity="0.12" stroke="#0071E3" stroke-width="1.1"/>
      <text x="778" y="154" text-anchor="middle" fill="#0A4F9E">Anthropic</text>
      <rect x="716" y="170" width="124" height="30" rx="8" fill="#0071E3" fill-opacity="0.12" stroke="#0071E3" stroke-width="1.1"/>
      <text x="778" y="190" text-anchor="middle" fill="#0A4F9E">OpenAI</text>
      <rect x="716" y="206" width="124" height="30" rx="8" fill="#0071E3" fill-opacity="0.12" stroke="#0071E3" stroke-width="1.1"/>
      <text x="778" y="226" text-anchor="middle" fill="#0A4F9E">Gemini</text>
      <rect x="716" y="242" width="124" height="30" rx="8" fill="#0071E3" fill-opacity="0.12" stroke="#0071E3" stroke-width="1.1"/>
      <text x="778" y="262" text-anchor="middle" fill="#0A4F9E">DeepSeek · compat</text>
    </g>
  </g>

  <!-- Ledger -->
  <g>
    <rect x="356" y="332" width="212" height="0.1" fill="none"/>
    <rect x="356" y="316" width="212" height="40" rx="11" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5"/>
    <text x="462" y="333" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0B6B53">~/.fuse/ledger.db (bbolt)</text>
    <text x="462" y="348" text-anchor="middle" font-size="10.5" fill="#0E7C66">(project, day) → tokens · usd · req</text>
  </g>
</svg>
